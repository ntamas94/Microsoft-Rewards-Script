# Portainer -> Stacks -> Add stack -> Web editor, then paste this file.
#
# Do NOT put your account credentials in here. Add them in the "Environment variables"
# box underneath the editor (Add an environment variable), so they stay in Portainer and
# never end up in git:
#
#   ACCOUNT_1_EMAIL      = you@example.com
#   ACCOUNT_1_PASSWORD   = <your password>
#
# For more accounts add ACCOUNT_2_EMAIL / ACCOUNT_2_PASSWORD in Portainer as well, and
# copy the two matching lines in the environment block below. Numbering must start at 1
# and stay contiguous - the script stops at the first missing ACCOUNT_N_EMAIL.
#
# v4 has no accounts.json; accounts come from these variables only.

services:
    microsoft-rewards-script:
        image: ghcr.io/thenetsky/microsoft-rewards-script:4
        container_name: microsoft-rewards-script
        restart: unless-stopped

        volumes:
            - /mnt/hdd/microsoft-rewards-script/config:/usr/src/microsoft-rewards-script/config
            - /mnt/hdd/microsoft-rewards-script/sessions:/usr/src/microsoft-rewards-script/sessions

        environment:
            # -- Accounts: values come from the Portainer environment variables --
            ACCOUNT_1_EMAIL: '${ACCOUNT_1_EMAIL}'
            ACCOUNT_1_PASSWORD: '${ACCOUNT_1_PASSWORD}'

            # -- Scheduler --
            TZ: 'Europe/Budapest'
            NODE_ENV: 'production'
            CRON_SCHEDULE: '0 7 * * *' # daily at 07:00, see crontab.guru
            RUN_ON_START: 'true' # also run once when the stack starts
            SKIP_RANDOM_SLEEP: 'false'

            # -- Workers: everything on --
            CONFIG_WORKER_DAILY_SET: 'true'
            CONFIG_WORKER_CLAIM_BONUS_POINTS: 'true'
            CONFIG_WORKER_MORE_PROMOTIONS: 'true'
            CONFIG_WORKER_PUNCH_CARDS: 'true'
            CONFIG_WORKER_APP_PROMOTIONS: 'true'
            CONFIG_WORKER_DESKTOP_SEARCH: 'true'
            CONFIG_WORKER_MOBILE_SEARCH: 'true'
            CONFIG_WORKER_DAILY_CHECKIN: 'true'
            CONFIG_WORKER_READ_TO_EARN: 'true'
            CONFIG_WORKER_ACTIVATE_SEARCH_PERK: 'true'
            # Off by default upstream, and the image ships it off: the visual-search streak
            CONFIG_WORKER_VISUAL_SEARCH: 'true'
            # Also off by default upstream - farms searches past the daily cap, which is the
            # one setting here that looks unlike normal use. Set to 'false' to play it safe.
            CONFIG_WORKER_BONUS_SEARCHES: 'true'
            CONFIG_SEARCH_MAX_BONUS_SEARCHES: '110'

            # -- Activities --
            CONFIG_ACTIVITY_URL_REWARD: 'true'
            CONFIG_ACTIVITY_SEARCH_ON_BING: 'true'

            # -- Behaviour --
            CONFIG_ENSURE_STREAK_PROTECTION: 'true'
            CONFIG_AUTO_CLAIM_PUNCHCARD_REWARDS: 'true'
            CONFIG_SEARCH_SCROLL_RANDOM: 'true'
            CONFIG_SEARCH_CLICK_RANDOM: 'true'

        healthcheck:
            test: ['CMD-SHELL', 'pgrep -x node >/dev/null 2>&1 || pgrep -x cron >/dev/null 2>&1']
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s

        security_opt:
            - no-new-privileges:true
